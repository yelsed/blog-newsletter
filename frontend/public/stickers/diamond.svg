<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gem facets -->
  <polygon
    points="100,10 180,80 100,192 20,80"
    fill="#A855F7"
    stroke="#7C22CC"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Top facet highlight -->
  <polygon
    points="100,10 180,80 100,80 20,80"
    fill="#C084FC"
    stroke="#7C22CC"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Center divider -->
  <line x1="20" y1="80" x2="100" y2="80" stroke="#7C22CC" stroke-width="2"/>
  <line x1="100" y1="80" x2="180" y2="80" stroke="#7C22CC" stroke-width="2"/>
  <!-- Inner facet lines from top -->
  <line x1="100" y1="10" x2="100" y2="80" stroke="#7C22CC" stroke-width="2" opacity="0.6"/>
  <!-- Inner facet lines from bottom -->
  <line x1="60" y1="80" x2="100" y2="192" stroke="#7C22CC" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="80" x2="100" y2="192" stroke="#7C22CC" stroke-width="1.5" opacity="0.5"/>
</svg>
